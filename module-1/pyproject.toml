[project]
name = "module-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramya Iyengar", email = "ramyapdmnbhn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.1",
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.9",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.9",
    "tqdm>=4.70.1",
]

[project.scripts]
module-1 = "module_1:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
